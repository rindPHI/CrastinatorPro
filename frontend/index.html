<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crastinator Pro</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#e4572e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Crastinator Pro</h1>
        <p class="tagline">Later is greater.</p>
      </div>

      <section class="side-section">
        <h2>Status</h2>
        <div class="segmented" id="status-filter" role="group" aria-label="Status-Filter">
          <button type="button" class="segmented-option is-active" data-value="open">Offen</button>
          <button type="button" class="segmented-option" data-value="done">Erledigt</button>
          <button type="button" class="segmented-option" data-value="all">Alle</button>
        </div>
      </section>

      <section class="side-section">
        <h2>Zugewiesen an</h2>
        <select id="filter-assignee" class="select-field">
          <option value="">Alle</option>
        </select>
      </section>

      <details class="side-section disclosure">
        <summary>Sortierung</summary>
        <div class="disclosure-body">
          <label class="field-label">
            Kriterium
            <select id="sort-by" class="select-field">
              <option value="">Keine</option>
              <option value="dueDate">Fälligkeitsdatum</option>
              <option value="title">Titel</option>
              <option value="priority">Priorität</option>
            </select>
          </label>
          <label class="field-label">
            Reihenfolge
            <select id="sort-order" class="select-field">
              <option value="asc">Aufsteigend</option>
              <option value="desc">Absteigend</option>
            </select>
          </label>
        </div>
      </details>

      <section class="side-section">
        <label class="switch-row">
          <span>Auto-+10 für überfällige Tasks</span>
          <span class="switch">
            <input type="checkbox" id="auto-plus10-toggle" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="side-section">
        <h2>KI-Assistent fragen</h2>
        <select id="ask-user" class="select-field"></select>
        <textarea
          id="ask-question"
          class="text-field"
          rows="2"
          placeholder="z. B. Wie viele Tasks sind offen?"
        ></textarea>
        <button type="button" id="ask-button" class="btn btn-quiet">Fragen</button>
        <p class="side-answer" id="ai-answer"></p>
      </section>

      <details class="side-section disclosure">
        <summary>Mehr</summary>
        <div class="disclosure-body">
          <a id="export-link" class="link-action" href="/api/tasks/export">CSV exportieren</a>
          <label class="file-action">
            CSV importieren
            <input type="file" id="import-file" accept=".csv" />
          </label>
          <p class="side-answer" id="import-result"></p>
        </div>
      </details>
    </aside>

    <main class="main">
      <header class="main-header">
        <h2 id="list-heading">Offene Tasks</h2>
        <p class="list-count" id="list-count"></p>
      </header>

      <form class="search-bar" id="search-form" role="search">
        <span class="icon icon-search"></span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Tasks durchsuchen (Titel &amp; Beschreibung)"
          aria-label="Tasks durchsuchen"
          autocomplete="off"
        />
      </form>

      <p class="error" id="task-list-error"></p>

      <ul class="task-list" id="task-list"></ul>
      <p class="empty-state" id="empty-state" hidden>Keine Tasks in dieser Ansicht.</p>

      <div class="add-actions">
        <button type="button" class="btn btn-add" id="show-add-task">
          <span class="icon icon-plus"></span>
          Task hinzufügen
        </button>
        <button type="button" class="btn btn-ai" id="show-ai-task">
          <span class="icon icon-sparkle"></span>
          Task mit KI erstellen
        </button>
      </div>

      <form class="add-panel" id="new-task-form" hidden>
        <input type="text" id="task-title" class="add-panel-title" placeholder="Titel" required />
        <div class="add-panel-row">
          <label class="pill pill-field">
            <span class="icon icon-calendar"></span>
            <input type="date" id="task-due-date" />
          </label>
          <label class="pill pill-field">
            <span class="icon icon-flag"></span>
            <select id="task-priority">
              <option value="low">Niedrig</option>
              <option value="medium" selected>Mittel</option>
              <option value="high">Hoch</option>
            </select>
          </label>
          <label class="pill pill-field">
            <span class="icon icon-user"></span>
            <select id="task-assignee">
              <option value="">Niemand</option>
            </select>
          </label>
        </div>
        <input
          type="text"
          id="task-description"
          class="add-panel-description"
          placeholder="Beschreibung (optional)"
        />
        <div class="add-panel-actions">
          <p class="error" id="new-task-error"></p>
          <button type="button" class="icon-btn icon-btn-cancel" id="cancel-new-task" aria-label="Abbrechen">
            <span class="icon icon-x"></span>
          </button>
          <button type="submit" class="icon-btn icon-btn-submit" aria-label="Task anlegen">
            <span class="icon icon-arrow-right"></span>
          </button>
        </div>
      </form>

      <form class="add-panel" id="ai-create-form" hidden>
        <input
          type="text"
          id="ai-create-text"
          class="add-panel-title"
          placeholder='z. B. „Dringend: Folien für Alice morgen fertigstellen“'
          required
        />
        <div class="add-panel-actions">
          <p class="error" id="ai-create-error"></p>
          <button type="button" class="icon-btn icon-btn-cancel" id="cancel-ai-task" aria-label="Abbrechen">
            <span class="icon icon-x"></span>
          </button>
          <button type="submit" class="icon-btn icon-btn-submit icon-btn-ai" aria-label="Task mit KI erstellen">
            <span class="icon icon-sparkle"></span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
